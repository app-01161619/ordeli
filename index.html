<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ordeli</title>

  <meta name="theme-color" content="#208aef" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />

  <!-- iOS PWA support: Safari ignores manifest.json for a lot of this,
       so these meta tags + apple-touch-icon are what actually matter for
       "Add to Home Screen" behaving like an app. -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Ordeli" />

  <style>
    :root { color-scheme: light; --blue: #208aef; --ink: #132238; --muted: #64748b; --paper: #fff; --wash: #eef6ff; --line: #d7e3f0; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; color: var(--ink); background: radial-gradient(circle at top right, #dff0ff, transparent 42%), #f7fbff; font-family: Georgia, 'Times New Roman', serif; }
    main { width: min(100% - 32px, 680px); margin: 0 auto; padding: 48px 0 32px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 56px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 700; }
    .brand img { width: 36px; height: 36px; border-radius: 9px; }
    .status, .intro, label, textarea, button, #message, footer { font-family: system-ui, sans-serif; }
    .status { color: var(--muted); font-size: 14px; }
    .status::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 7px; border-radius: 50%; background: #28a745; }
    .status.offline::before { background: #d97706; }
    h1 { max-width: 560px; margin: 0; font-size: clamp(42px, 9vw, 76px); line-height: .98; letter-spacing: -2px; }
    .intro { max-width: 480px; margin: 24px 0 36px; color: var(--muted); font-size: 18px; line-height: 1.55; }
    .note { padding: 24px; border: 1px solid var(--line); border-radius: 12px; background: #ffffffdd; box-shadow: 0 16px 40px #21466d12; }
    label { display: block; margin-bottom: 9px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    textarea { display: block; width: 100%; min-height: 120px; resize: vertical; padding: 14px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: var(--paper); font-size: 16px; line-height: 1.5; }
    .actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
    button { padding: 11px 16px; border: 0; border-radius: 7px; color: white; background: var(--blue); font-size: 15px; font-weight: 600; cursor: pointer; }
    button.secondary { color: var(--ink); background: var(--wash); }
    #message, footer { color: var(--muted); font-size: 13px; }
    footer { margin-top: 48px; }
    @media (max-width: 480px) { main { padding-top: 24px; } header { margin-bottom: 42px; } .status { font-size: 12px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand"><img src="/icons/icon-192.png" alt="" /> Ordeli</div>
      <div id="status" class="status">Online</div>
    </header>
    <section aria-labelledby="title">
      <h1 id="title">A small space for what you are making.</h1>
      <p class="intro">This is a simple, installable Ordeli app. Your note is saved on this device and remains available without an internet connection.</p>
      <form id="note-form" class="note">
        <label for="note">Today's note</label>
        <textarea id="note" placeholder="What needs making today?" autocomplete="off"></textarea>
        <div class="actions">
          <span id="message" role="status"></span>
          <div><button id="install" class="secondary" type="button" hidden>Install app</button> <button type="submit">Save note</button></div>
        </div>
      </form>
    </section>
    <footer>Ordeli works offline and syncs no data to a server.</footer>
  </main>
  <script>
    const note = document.querySelector('#note');
    const message = document.querySelector('#message');
    const status = document.querySelector('#status');
    const install = document.querySelector('#install');
    let installPrompt;
    note.value = localStorage.getItem('ordeli-note') || '';
    document.querySelector('#note-form').addEventListener('submit', (event) => {
      event.preventDefault();
      localStorage.setItem('ordeli-note', note.value);
      message.textContent = 'Saved on this device.';
    });
    function updateConnection() {
      status.textContent = navigator.onLine ? 'Online' : 'Offline';
      status.classList.toggle('offline', !navigator.onLine);
    }
    window.addEventListener('online', updateConnection);
    window.addEventListener('offline', updateConnection);
    updateConnection();
    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      installPrompt = event;
      install.hidden = false;
    });
    install.addEventListener('click', async () => {
      if (!installPrompt) return;
      installPrompt.prompt();
      await installPrompt.userChoice;
      installPrompt = null;
      install.hidden = true;
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        const registration = await navigator.serviceWorker.register('/sw.js').catch(() => null);
        if (registration?.waiting) registration.waiting.postMessage({ type: 'SKIP_WAITING' });
      });
      navigator.serviceWorker.addEventListener('controllerchange', () => window.location.reload());
    }
  </script>
</body>
</html>
