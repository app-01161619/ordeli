<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>Seller App</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <main id="app">

    <!-- =========================
         LOGIN SCREEN
    ========================== -->
    <section
      id="loginScreen"
      class="screen"
      hidden
    >
      <div class="auth-container">
        <div class="auth-card">

          <h1>Seller Login</h1>

          <p class="auth-subtitle">
            Log in to your seller account.
          </p>

          <form id="loginForm">

            <div class="form-group">
              <label for="loginEmail">
                Email
              </label>

              <input
                id="loginEmail"
                type="email"
                autocomplete="email"
                required
              >
            </div>

            <div class="form-group">
              <label for="loginPassword">
                Password
              </label>

              <input
                id="loginPassword"
                type="password"
                autocomplete="current-password"
                required
              >
            </div>

            <button
              id="loginButton"
              type="submit"
            >
              Log In
            </button>

            <p
              id="loginMessage"
              class="form-message"
            ></p>

          </form>

          <p class="auth-link">
            Don't have an account?

            <a
              href="#register"
              data-route="register"
            >
              Create one
            </a>
          </p>

        </div>
      </div>
    </section>


    <!-- =========================
         REGISTER SCREEN
    ========================== -->
    <section
      id="registerScreen"
      class="screen"
      hidden
    >
      <div class="auth-container">
        <div class="auth-card">

          <h1>Create Account</h1>

          <p class="auth-subtitle">
            Create your seller account.
          </p>

          <form id="registerForm">

            <div class="form-group">
              <label for="registerEmail">
                Email
              </label>

              <input
                id="registerEmail"
                type="email"
                autocomplete="email"
                required
              >
            </div>

            <div class="form-group">
              <label for="registerPassword">
                Password
              </label>

              <input
                id="registerPassword"
                type="password"
                autocomplete="new-password"
                minlength="6"
                required
              >
            </div>

            <div class="form-group">
              <label for="registerConfirmPassword">
                Confirm Password
              </label>

              <input
                id="registerConfirmPassword"
                type="password"
                autocomplete="new-password"
                minlength="6"
                required
              >
            </div>

            <button
              id="registerButton"
              type="submit"
            >
              Create Account
            </button>

            <p
              id="registerMessage"
              class="form-message"
            ></p>

          </form>

          <p class="auth-link">
            Already have an account?

            <a
              href="#login"
              data-route="login"
            >
              Log in
            </a>
          </p>

        </div>
      </div>
    </section>


    <!-- =========================
         HOME SCREEN
         TEMPORARY AUTHENTICATED
         SCREEN FOR STEP 1
    ========================== -->
    <section
      id="homeScreen"
      class="screen"
      hidden
    >
      <div class="auth-container">
        <div class="auth-card">

          <h1>Seller App</h1>

          <p>
            You are logged in.
          </p>

          <p id="currentUserEmail"></p>

          <button
            id="logoutButton"
            type="button"
          >
            Log Out
          </button>

        </div>
      </div>
    </section>

  </main>

  <script type="module" src="./js/app.js"></script>

</body>
</html>
